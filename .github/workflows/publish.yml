name: Publish gem

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - run: bundle exec rspec

      - uses: rubygems/configure-rubygems-credentials@v1.0.0

      - name: Publish to RubyGems
        run: |
          gem build secscan.gemspec
          gem push secscan-*.gem
